name: Apply exec-bit fix
on:
  push:
    branches: [cursor/fix-launcher-exec-bit-d349]
    paths: [.github/workflows/apply-exec-bit-fix.yml]
permissions:
  contents: write
concurrency:
  group: apply-exec-bit-fix
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/fix-launcher-exec-bit-d349
      - name: Mark launchers 100755 and apply hardening
        shell: bash
        run: |
          set -euo pipefail
          git apply --whitespace=nowarn <<'PATCH_EOF'
          diff --git a/scripts/electron-binary.js b/scripts/electron-binary.js
          index 32469fe..a66a21a 100644
          --- a/scripts/electron-binary.js
          +++ b/scripts/electron-binary.js
          @@ -197,8 +197,39 @@ function ensureElectronBinary(root, options = {}) {
             };
           }

          +/**
          + * Launcher scripts must stay executable: Plasma .desktop Exec= runs
          + * blackforest-tools.sh directly and fails silently on mode 644. Git tracks
          + * them as 100755, but checkouts with core.filemode=false can still leave 644.
          + */
          +function ensureLauncherScriptsExecutable(root, platform = process.platform) {
          +  if (platform === "win32") return [];
          +  const dir = path.join(root, "scripts");
          +  let names;
          +  try {
          +    names = fs.readdirSync(dir);
          +  } catch {
          +    return [];
          +  }
          +  const fixed = [];
          +  for (const name of names) {
          +    if (!name.endsWith(".sh") && name !== "blackforest-widget-session") continue;
          +    const file = path.join(dir, name);
          +    try {
          +      const stat = fs.statSync(file);
          +      if (!stat.isFile() || (stat.mode & 0o111) === 0o111) continue;
          +      fs.chmodSync(file, stat.mode | 0o755);
          +      fixed.push(name);
          +    } catch {
          +      // Best effort; the launcher is still run via bash by the updater.
          +    }
          +  }
          +  return fixed;
          +}
          +
           module.exports = {
             ENV_KEYS_TO_DROP,
          +  ensureLauncherScriptsExecutable,
             platformBinaryName,
             electronPaths,
             isExecutable,
          diff --git a/scripts/ensure-electron.sh b/scripts/ensure-electron.sh
          old mode 100644
          new mode 100755
          index c51f719..0b14cfc
          --- a/scripts/ensure-electron.sh
          +++ b/scripts/ensure-electron.sh
          @@ -7,6 +7,8 @@ set -euo pipefail
           ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
           ELECTRON_BIN="$ROOT/node_modules/electron/dist/electron"

          +chmod +x "$ROOT"/scripts/*.sh "$ROOT/scripts/blackforest-widget-session" 2>/dev/null || true
          +
           if [[ -x "$ELECTRON_BIN" ]] && [[ -s "$ELECTRON_BIN" ]] && [[ -f "$ROOT/node_modules/electron/path.txt" ]]; then
             exit 0
           fi
          diff --git a/scripts/postinstall-electron.js b/scripts/postinstall-electron.js
          index f5ea3d2..a1e18ca 100644
          --- a/scripts/postinstall-electron.js
          +++ b/scripts/postinstall-electron.js
          @@ -1,9 +1,10 @@
           "use strict";

           const path = require("node:path");
          -const { ensureElectronBinary } = require("./electron-binary");
          +const { ensureElectronBinary, ensureLauncherScriptsExecutable } = require("./electron-binary");

           const root = path.join(__dirname, "..");
          +ensureLauncherScriptsExecutable(root);
           const result = ensureElectronBinary(root, { log: (line) => console.log(line) });

           // npm is still installing electron; its own install script runs next.
          diff --git a/src/shell-update.js b/src/shell-update.js
          index 3fe56b5..fc1ddef 100644
          --- a/src/shell-update.js
          +++ b/src/shell-update.js
          @@ -6,6 +6,7 @@ const https = require("node:https");
           const path = require("node:path");
           const {
             ensureElectronBinary,
          +  ensureLauncherScriptsExecutable,
             cleanEnv: cleanElectronEnv,
           } = require("../scripts/electron-binary");

          @@ -268,6 +269,7 @@ async function checkShellUpdate({
            */
           function applyGitUpdate(root, { remote = "origin", branch = DEFAULT_BRANCH } = {}) {
             runGit(root, ["pull", "--ff-only", remote, branch]);
          +  ensureLauncherScriptsExecutable(root);

             if (process.platform === "linux") {
               markPendingNpmInstall(root);
          diff --git a/test/electron-binary.test.js b/test/electron-binary.test.js
          index 9dcadb1..02f979f 100644
          --- a/test/electron-binary.test.js
          +++ b/test/electron-binary.test.js
          @@ -10,6 +10,7 @@ const {
             inspectElectron,
             ensureElectronBinary,
             cleanEnv,
          +  ensureLauncherScriptsExecutable,
           } = require("../scripts/electron-binary");

           const POSIX = process.platform !== "win32";
          @@ -122,3 +123,19 @@ test("cleanEnv drops skip/platform overrides", () => {
             });
             assert.deepEqual(env, { PATH: "/usr/bin" });
           });
          +
          +test("ensureLauncherScriptsExecutable restores +x on launcher scripts only", { skip: !POSIX }, () => {
          +  const root = fs.mkdtempSync(path.join(os.tmpdir(), "bf-launcher-test-"));
          +  const dir = path.join(root, "scripts");
          +  fs.mkdirSync(dir);
          +  for (const name of ["blackforest-tools.sh", "blackforest-widget-session", "notes.js"]) {
          +    fs.writeFileSync(path.join(dir, name), "#!/usr/bin/env bash\n");
          +    fs.chmodSync(path.join(dir, name), 0o644);
          +  }
          +  const fixed = ensureLauncherScriptsExecutable(root, "linux");
          +  assert.deepEqual(fixed.sort(), ["blackforest-tools.sh", "blackforest-widget-session"]);
          +  assert.ok(fs.statSync(path.join(dir, "blackforest-tools.sh")).mode & 0o100);
          +  assert.ok(fs.statSync(path.join(dir, "blackforest-widget-session")).mode & 0o100);
          +  assert.equal(fs.statSync(path.join(dir, "notes.js")).mode & 0o111, 0);
          +  assert.deepEqual(ensureLauncherScriptsExecutable(root, "linux"), []);
          +});
          PATCH_EOF
          git ls-files 'scripts/*.sh' scripts/blackforest-widget-session | xargs chmod +x
          git add -A scripts src test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Launcher scripts tracked as 100755; re-chmod after update and install"
          git push origin HEAD:cursor/fix-launcher-exec-bit-d349
