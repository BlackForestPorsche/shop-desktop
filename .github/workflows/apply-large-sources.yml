name: Apply large desktop sources
# One-shot: assemble Tools 1.5.33 screen sail, then restore this workflow.
on:
  push:
    paths:
      - tmp/large-sources/CARDINAL-READY
permissions:
  contents: write
concurrency:
  group: apply-large-sources-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/pirate-cardinal-4218
          fetch-depth: 0
      - name: Assemble screen sail
        shell: bash
        run: |
          python3 << 'PY'
          import pathlib, gzip, base64, hashlib, subprocess, sys
          root = pathlib.Path("tmp/large-sources")
          parts = []
          for i in range(13):
              p = root / f"cardinal-1533.{i:02d}"
              if not p.exists():
                  print("missing", p, file=sys.stderr)
                  sys.exit(1)
              parts.append(p.read_text().strip())
          data = gzip.decompress(base64.b64decode("".join(parts)))
          want = "5072aeee2660c706835271adc7170d220d9c6118611301a7ae4e492a52910030"
          got = hashlib.sha256(data).hexdigest()
          if got != want:
              print("payload sha", got, file=sys.stderr)
              sys.exit(1)
          i = 0
          wrote = []
          while i < len(data):
              nl = data.index(b"\n", i)
              rel = data[i:nl].decode()
              i = nl + 1
              nl = data.index(b"\n", i)
              n = int(data[i:nl])
              i = nl + 1
              blob = data[i:i+n]
              i += n
              path = pathlib.Path(rel)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(blob)
              wrote.append(rel)
              print("wrote", rel, len(blob))
          orig = base64.b64decode("")
          wf = pathlib.Path(".github/workflows/apply-large-sources.yml")
          wf.write_bytes(orig)
          subprocess.check_call(["git", "config", "user.name", "github-actions[bot]"])
          subprocess.check_call(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"])
          subprocess.check_call(["git", "add", "--"] + wrote + [".github/workflows/apply-large-sources.yml"])
          for i in range(13):
              subprocess.check_call(["git", "rm", "-f", f"tmp/large-sources/cardinal-1533.{i:02d}"])
          subprocess.check_call(["git", "rm", "-f", "tmp/large-sources/CARDINAL-READY"])
          subprocess.check_call(["git", "commit", "-m", "Tools 1.5.33: sail the screen, no yaw"])
          subprocess.check_call(["git", "push", "origin", "HEAD:cursor/pirate-cardinal-4218"])
          PY
