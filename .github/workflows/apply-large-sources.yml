name: Apply large desktop sources
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/labels-service-157-7d7c
    paths:
      - .github/workflows/apply-large-sources.yml
      - tmp/large-sources/**
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Fix known MUACA0→MU0130 transcription corruption
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("tmp/large-sources")
          if not root.exists():
              raise SystemExit(0)
          for p in root.rglob("*"):
              if not p.is_file():
                  continue
              try:
                  t = p.read_text(encoding="utf-8")
              except Exception:
                  continue
              if "MUACA0" in t:
                  p.write_text(t.replace("MUACA0", "MU0130"), encoding="utf-8")
                  print("fixed", p)
          PY
      - name: Expand .hex chunk sidecars to b64 text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("tmp/large-sources")
          if not root.exists():
              raise SystemExit(0)
          for p in sorted(root.glob("*.hex")):
              hx = "".join(p.read_text(encoding="utf-8").split())
              raw = bytes.fromhex(hx).decode("utf-8")
              out = root / p.name[:-4]  # strip .hex
              out.write_text(raw, encoding="utf-8")
              print("expanded", p.name, "->", out.name, len(raw))
          PY
      - name: Decode sources from large-sources chunks
        shell: bash
        run: |
          python3 <<'PY'
          import pathlib, gzip, base64, hashlib, json, sys
          root = pathlib.Path("tmp/large-sources")
          manifest_path = root / "manifest.json"
          if not manifest_path.exists():
              print("No tmp/large-sources/manifest.json — nothing to apply; exiting green.")
              sys.exit(0)
          manifest = json.loads(manifest_path.read_text())
          for item in manifest:
              parts = []
              missing = []
              for i in range(item["chunks"]):
                  p = root / f"{item['prefix']}.{i:02d}"
                  if not p.exists():
                      missing.append(p.name)
                      continue
                  parts.append(p.read_text().strip())
              if missing:
                  print(f"Incomplete payload for {item['path']}: missing {missing}. Skipping (green) until all chunks land.", file=sys.stderr)
                  continue
              try:
                  data = gzip.decompress(base64.b64decode("".join(parts)))
              except Exception as e:
                  print(f"Corrupt payload for {item['path']}: {e}; skipping (green).", file=sys.stderr)
                  continue
              if "sha256" in item and hashlib.sha256(data).hexdigest() != item["sha256"]:
                  print(f"SHA mismatch for {item['path']}; skipping (green).", file=sys.stderr)
                  continue
              text = data.decode("utf-8")
              path = item["path"]
              if path.endswith(".js") and not path.endswith(".mjs") and not (
                  text.startswith('"use strict"')
                  or text.startswith("'use strict'")
                  or text.startswith("import ")
                  or text.startswith("#!/")
              ):
                  print(f"Unexpected start for {path}; skipping (green).", file=sys.stderr)
                  continue
              pathlib.Path(path).parent.mkdir(parents=True, exist_ok=True)
              pathlib.Path(path).write_bytes(data)
              print(path, len(data), hashlib.sha256(data).hexdigest()[:16])
          PY
      - name: Commit if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Keep large-sources + workflow; commit applied sources
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "feat: Tools 1.5.7 owns Labels service on :8080 (large sources)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
