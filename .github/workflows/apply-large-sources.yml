name: Apply large desktop sources
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/labels-service-159-7d7c
    paths:
      - .github/workflows/apply-large-sources.yml
      - tmp/large-sources/**
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Copy Labels ownership sources from prior branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cursor/labels-service-156-7d7c cursor/labels-service-158-7d7c
          # Vendored Labels tree + service module (byte-match local 1.5.9)
          git checkout origin/cursor/labels-service-156-7d7c -- \
            src/labels-server.js \
            labels/server.mjs \
            labels/shared/detect.mjs \
            labels/shared/media.mjs \
            labels/shared/print.mjs \
            labels/shared/ro-label.mjs \
            scripts/install-windows.ps1
          # install-manjaro + Labels-aware main from 158
          git checkout origin/cursor/labels-service-158-7d7c -- \
            scripts/install-manjaro.sh \
            src/main.js
          # Re-apply 1.5.8 website-unlock exchangedGateThisSession delta onto Labels main
          if [[ -f tmp/large-sources/main-exchanged-gate.patch ]]; then
            patch -p1 < tmp/large-sources/main-exchanged-gate.patch
          fi
          echo "Copied Labels sources; main.js markers:"
          rg -n "ensureLabelsRunning|exchangedGateThisSession|leaveUnlockScreen|openLabelsWindow" src/main.js || true
      - name: Decode optional large-sources chunks
        shell: bash
        run: |
          python3 <<'PY'
          import pathlib, gzip, base64, hashlib, json, sys
          root = pathlib.Path("tmp/large-sources")
          manifest_path = root / "manifest.json"
          if not manifest_path.exists():
              print("No chunk manifest — skip decode.")
              sys.exit(0)
          manifest = json.loads(manifest_path.read_text())
          # Only apply src/main.js from chunks if present and complete (optional override)
          for item in manifest:
              if item.get("path") != "src/main.js":
                  continue
              parts = []
              missing = []
              for i in range(item["chunks"]):
                  p = root / f"{item['prefix']}.{i:02d}"
                  if not p.exists():
                      missing.append(p.name)
                      continue
                  parts.append(p.read_text().strip())
              if missing:
                  print("main.js chunks incomplete; keeping branch-copied+patched main", missing)
                  continue
              try:
                  data = gzip.decompress(base64.b64decode("".join(parts)))
              except Exception as e:
                  print("main.js chunk decode failed; keeping patched main", e)
                  continue
              if hashlib.sha256(data).hexdigest() != item.get("sha256", ""):
                  print("main.js SHA mismatch; keeping patched main")
                  continue
              pathlib.Path("src/main.js").write_bytes(data)
              print("src/main.js from chunks", len(data))
          PY
      - name: Commit if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "feat: Tools 1.5.9 Labels service ownership (vendored tree + boot/adopt)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
