name: Apply large desktop sources
# One-shot assemble for the 1.5.32 helm. Restores this file before it pushes.
on:
  push:
    branches:
      - cursor/pirate-feel-4218
    paths:
      - tmp/large-sources/FEEL-READY
permissions:
  contents: write
concurrency:
  group: apply-large-sources-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply shell chrome and clean upload artifacts
        shell: bash
        run: |
          python3 << 'PY'
          import pathlib, gzip, base64, hashlib, subprocess, sys
          root = pathlib.Path("tmp/large-sources")
          parts = []
          for i in range(6):
              p = root / f"feel-chrome-1532.{i:02d}"
              if not p.exists():
                  print("missing", p)
                  sys.exit(0)
              parts.append(p.read_text().strip())
          data = gzip.decompress(base64.b64decode("".join(parts)))
          want = "8a22d19046eb5df25a3524a524dde171c6e78c8d3ed3df475c66992b90240fa2"
          got = hashlib.sha256(data).hexdigest()
          if got != want or len(data) != 89157:
              print("sha mismatch", got, len(data), file=sys.stderr)
              sys.exit(1)
          path = pathlib.Path("src/shell-chrome.js")
          path.write_bytes(data)
          print("wrote", path, len(data))
          for i in range(6):
              rel = root / f"feel-chrome-1532.{i:02d}"
              if rel.exists():
                  rel.unlink()
                  print("removed", rel)
          ready = root / "FEEL-READY"
          if ready.exists():
              ready.unlink()
              print("removed", ready)
          pathlib.Path(".github/workflows/apply-large-sources.yml").write_bytes(base64.b64decode(""))
          subprocess.check_call(["git", "config", "user.name", "github-actions[bot]"])
          subprocess.check_call(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"])
          subprocess.check_call(["git", "add", "-A"])
          diff = subprocess.run(["git", "diff", "--cached", "--quiet"])
          if diff.returncode == 0:
              print("No changes")
              sys.exit(0)
          subprocess.check_call(["git", "commit", "-m", "Tools 1.5.32: apply shell chrome source"])
          subprocess.check_call(["git", "push", "origin", "HEAD:cursor/pirate-feel-4218"])
          PY
