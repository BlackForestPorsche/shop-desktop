name: Apply large desktop sources
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/labels-service-159-7d7c
    paths:
      - .github/workflows/apply-large-sources.yml
      - tmp/large-sources/**
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Merge origin/main (ahead-only ancestry)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Already contains main — ahead-only."
          else
            if ! git merge origin/main -m "merge: main into Labels 1.5.9 branch" -X ours; then
              git checkout --ours -- . || true
              git add -A
              git -c core.editor=true merge --continue || git commit --allow-empty -m "merge: main into Labels 1.5.9 branch (resolved)"
            fi
          fi
      - name: Decode sources from large-sources chunks
        shell: bash
        run: |
          python3 <<'PY'
          import pathlib, gzip, base64, hashlib, json, sys
          root = pathlib.Path("tmp/large-sources")
          manifest_path = root / "manifest.json"
          if not manifest_path.exists():
              print("No tmp/large-sources/manifest.json — nothing to apply; exiting green.")
              sys.exit(0)
          manifest = json.loads(manifest_path.read_text())
          for item in manifest:
              parts = []
              missing = []
              for i in range(item["chunks"]):
                  p = root / f"{item['prefix']}.{i:02d}"
                  if not p.exists():
                      missing.append(p.name)
                      continue
                  parts.append(p.read_text().strip())
              if missing:
                  print(f"Incomplete payload for {item['path']}: missing {missing}. Skipping.", file=sys.stderr)
                  continue
              try:
                  data = gzip.decompress(base64.b64decode("".join(parts)))
              except Exception as e:
                  print(f"Corrupt payload for {item['path']}: {e}; skipping.", file=sys.stderr)
                  continue
              if "sha256" in item and hashlib.sha256(data).hexdigest() != item["sha256"]:
                  print(f"SHA mismatch for {item['path']}; skipping.", file=sys.stderr)
                  continue
              path = item["path"]
              pathlib.Path(path).parent.mkdir(parents=True, exist_ok=True)
              pathlib.Path(path).write_bytes(data)
              print(path, len(data), hashlib.sha256(data).hexdigest()[:16])
          PY
      - name: Commit if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A labels scripts/ensure-labels.sh scripts/postinstall-labels.js scripts/sync-labels-vendor.sh scripts/install-manjaro.sh scripts/install-windows.ps1 src/app-menu.js src/labels-server.js src/main.js test/app-menu.test.js test/labels-server.test.js package.json .github/workflows/apply-large-sources.yml || true
          if ! git diff --staged --quiet; then
            git commit -m "feat: Tools 1.5.9 Labels ownership + main flash-loop merge"
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
