name: Apply large desktop sources
on:
  workflow_dispatch:
  push:
    branches: [cursor/windows-widgets-git-update-ea13]
    paths:
      - .github/workflows/apply-large-sources.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/windows-widgets-git-update-ea13
      - name: Decode widget-main.js and main.js
        shell: bash
        run: |
          python3 <<'PY'
          import base64, gzip, pathlib, hashlib
          files = {
            "src/widget-main.js": """""",
            "src/main.js": """""",
          }
          for path, b64s in files.items():
            data = gzip.decompress(base64.b64decode(b64s))
            pathlib.Path(path).write_bytes(data)
            text = data.decode("utf-8")
            assert text.startswith('"use strict"'), path
            print(path, len(text), hashlib.sha256(data).hexdigest()[:16])
          PY
      - name: Commit if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/widget-main.js src/main.js
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "fix: restore full widget-main.js and main.js from encoded payloads"
            git push origin HEAD:cursor/windows-widgets-git-update-ea13
          fi
