name: Apply large desktop sources
# One-shot assemble for the pirate helm. Restores this file and the
# historical large-sources manifest before it pushes.
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/pirate-survivors-4218
    paths:
      - tmp/large-sources/READY
permissions:
  contents: write
concurrency:
  group: apply-large-sources-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply shell chrome and clean upload artifacts
        shell: bash
        run: |
          python3 << 'PY'
          import pathlib, gzip, base64, hashlib, subprocess, sys
          root = pathlib.Path("tmp/large-sources")
          parts = []
          for i in range(6):
              p = root / f"shell-chrome-1531.{i:02d}"
              if not p.exists():
                  print("missing", p)
                  sys.exit(0)
              parts.append(p.read_text().strip())
          data = gzip.decompress(base64.b64decode("".join(parts)))
          want = "e9c6a9f7846db559cd251d9d515c6585c1a84d509a23342cfb3c7f5d65091abc"
          got = hashlib.sha256(data).hexdigest()
          if got != want or len(data) != 89037:
              print("sha mismatch", got, len(data), file=sys.stderr)
              sys.exit(1)
          path = pathlib.Path("src/shell-chrome.js")
          path.write_bytes(data)
          print("wrote", path, len(data))
          for rel in [
              "tmp/large-sources/shell-chrome-1531.00",
              "tmp/large-sources/shell-chrome-1531.01",
              "tmp/large-sources/shell-chrome-1531.02",
              "tmp/large-sources/shell-chrome-1531.03",
              "tmp/large-sources/shell-chrome-1531.04",
              "tmp/large-sources/shell-chrome-1531.05",
              "tmp/large-sources/shell-chrome.js.00",
              "tmp/large-sources/shell-chrome.js.01",
              "tmp/large-sources/READY",
          ]:
              p = pathlib.Path(rel)
              if p.exists():
                  p.unlink()
                  print("removed", rel)
          pathlib.Path("tmp/large-sources/manifest.json").write_bytes(base64.b64decode(""))
          pathlib.Path(".github/workflows/apply-large-sources.yml").write_bytes(base64.b64decode(""))
          subprocess.check_call(["git", "config", "user.name", "github-actions[bot]"])
          subprocess.check_call(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"])
          subprocess.check_call(["git", "add", "-A"])
          diff = subprocess.run(["git", "diff", "--cached", "--quiet"])
          if diff.returncode == 0:
              print("No changes")
              sys.exit(0)
          subprocess.check_call(["git", "commit", "-m", "Tools 1.5.31: apply shell chrome source"])
          subprocess.check_call(["git", "push", "origin", "HEAD:cursor/pirate-survivors-4218"])
          PY
