name: Apply large desktop sources
on:
  workflow_dispatch:
  push:
    branches: [cursor/tools-desk-shared-login-f952]
    paths:
      - .github/workflows/apply-large-sources.yml
      - tmp/large-sources/**
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/tools-desk-shared-login-f952
      - name: Decode main.js from large-sources
        shell: bash
        run: |
          python3 <<'PY'
          import pathlib, gzip, base64, hashlib, json, sys
          root = pathlib.Path("tmp/large-sources")
          manifest_path = root / "manifest.json"
          if not manifest_path.exists():
              print("No tmp/large-sources/manifest.json — nothing to apply; exiting green.")
              sys.exit(0)
          manifest = json.loads(manifest_path.read_text())
          for item in manifest:
              parts = []
              missing = []
              for i in range(item["chunks"]):
                  p = root / f"{item['prefix']}.{i:02d}"
                  if not p.exists():
                      missing.append(p.name)
                      continue
                  parts.append(p.read_text().strip())
              if missing:
                  print(
                      f"Incomplete payload for {item['path']}: missing {missing}. "
                      "Skipping (green) until all chunks land.",
                      file=sys.stderr,
                  )
                  continue
              try:
                  data = gzip.decompress(base64.b64decode("".join(parts)))
              except Exception as e:
                  print(f"Corrupt payload for {item['path']}: {e}; skipping (green).", file=sys.stderr)
                  continue
              text = data.decode("utf-8")
              if not text.startswith('"use strict"'):
                  print(f"Unexpected start for {item['path']}; skipping (green).", file=sys.stderr)
                  continue
              if "sha256" in item and hashlib.sha256(data).hexdigest() != item["sha256"]:
                  print(f"SHA mismatch for {item['path']}; skipping (green).", file=sys.stderr)
                  continue
              pathlib.Path(item["path"]).write_bytes(data)
              print(item["path"], len(data), hashlib.sha256(data).hexdigest()[:16])
          PY
      - name: Commit if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Shared login: restore full src/main.js (1.5.3)"
            git push origin HEAD:cursor/tools-desk-shared-login-f952
          fi
