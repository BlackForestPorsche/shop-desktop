name: Apply large desktop sources
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/labels-service-156-7d7c
    paths:
      - .github/workflows/apply-large-sources.yml
      - tmp/large-sources/**
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Assemble chunk parts if present
        shell: bash
        run: |
          python3 <<'PY'
          import pathlib, json, hashlib
          root = pathlib.Path("tmp/large-sources")
          am = root / "assemble-manifest.json"
          if not am.exists():
              print("No assemble-manifest.json — skip assemble")
              raise SystemExit(0)
          items = json.loads(am.read_text())
          for item in items:
              chunk = item["chunk"]
              parts = []
              missing = []
              for i in range(item["parts"]):
                  p = root / f"{chunk}.p{i:02d}"
                  if not p.exists():
                      missing.append(p.name)
                      continue
                  parts.append(p.read_text().strip())
              if missing:
                  print(f"Incomplete parts for {chunk}: {missing}; skip")
                  continue
              body = "".join(parts)
              if item.get("sha256") and hashlib.sha256(body.encode()).hexdigest() != item["sha256"]:
                  print(f"Part SHA mismatch for {chunk}; skip")
                  continue
              (root / chunk).write_text(body + "\n")
              print("assembled", chunk, len(body))
          PY
      - name: Decode sources from large-sources chunks
        shell: bash
        run: |
          python3 <<'PY'
          import pathlib, gzip, base64, hashlib, json, sys
          root = pathlib.Path("tmp/large-sources")
          manifest_path = root / "manifest.json"
          if not manifest_path.exists():
              print("No tmp/large-sources/manifest.json — nothing to apply; exiting green.")
              sys.exit(0)
          manifest = json.loads(manifest_path.read_text())
          applied = []
          for item in manifest:
              parts = []
              missing = []
              for i in range(item["chunks"]):
                  p = root / f"{item['prefix']}.{i:02d}"
                  if not p.exists():
                      missing.append(p.name)
                      continue
                  parts.append(p.read_text().strip())
              if missing:
                  print(
                      f"Incomplete payload for {item['path']}: missing {missing}. "
                      "Skipping (green) until all chunks land.",
                      file=sys.stderr,
                  )
                  continue
              try:
                  data = gzip.decompress(base64.b64decode("".join(parts)))
              except Exception as e:
                  print(f"Corrupt payload for {item['path']}: {e}; skipping (green).", file=sys.stderr)
                  continue
              if "sha256" in item and hashlib.sha256(data).hexdigest() != item["sha256"]:
                  print(f"SHA mismatch for {item['path']}; skipping (green).", file=sys.stderr)
                  continue
              text = data.decode("utf-8")
              path = item["path"]
              if path.endswith(".js") and not (
                  text.startswith('"use strict"')
                  or text.startswith("'use strict'")
                  or text.startswith("import ")
              ):
                  print(f"Unexpected start for {path}; skipping (green).", file=sys.stderr)
                  continue
              pathlib.Path(path).parent.mkdir(parents=True, exist_ok=True)
              pathlib.Path(path).write_bytes(data)
              applied.append(path)
              print(path, len(data), hashlib.sha256(data).hexdigest()[:16])
          pathlib.Path("/tmp/applied-paths.txt").write_text("\n".join(applied) + "\n")
          PY
      - name: Commit if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -f /tmp/applied-paths.txt ]]; then
            while IFS= read -r p; do
              [[ -n "$p" ]] && git add -- "$p"
            done < /tmp/applied-paths.txt
          fi
          git add .github/workflows/apply-large-sources.yml || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "feat: Tools 1.5.6 owns Labels service on :8080"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
