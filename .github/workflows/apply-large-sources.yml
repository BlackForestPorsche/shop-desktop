name: Apply large desktop sources
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/labels-service-158-7d7c
    paths:
      - .github/workflows/apply-large-sources.yml
      - tmp/large-sources/**
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Decode sources from large-sources chunks
        shell: bash
        run: |
          python3 <<'PY'
          import pathlib, gzip, base64, hashlib, json, sys
          root = pathlib.Path("tmp/large-sources")
          manifest_path = root / "manifest.json"
          if not manifest_path.exists():
              print("No tmp/large-sources/manifest.json — nothing to apply; exiting green.")
              sys.exit(0)
          manifest = json.loads(manifest_path.read_text())
          wanted_prefixes = {item["prefix"] for item in manifest}
          for p in list(root.iterdir()):
              if p.name in {"manifest.json", ".mcp-probe", ".apply-trigger"}:
                  continue
              if p.is_file() and not any(p.name.startswith(pref + ".") for pref in wanted_prefixes):
                  print("Removing stale", p.name)
                  p.unlink()
          for item in manifest:
              parts = []
              missing = []
              for i in range(item["chunks"]):
                  p = root / f"{item['prefix']}.{i:02d}"
                  if not p.exists():
                      missing.append(p.name)
                      continue
                  parts.append(p.read_text().strip())
              if missing:
                  print(f"Incomplete for {item['path']}: {missing}", file=sys.stderr)
                  sys.exit(1)
              data = gzip.decompress(base64.b64decode("".join(parts)))
              if hashlib.sha256(data).hexdigest() != item["sha256"]:
                  print(f"SHA mismatch {item['path']}", file=sys.stderr)
                  sys.exit(1)
              path = pathlib.Path(item["path"])
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              print("Wrote", item["path"], len(data))
          PY
      - name: Commit if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "feat(labels): apply large 1.5.8 sources from chunks"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
