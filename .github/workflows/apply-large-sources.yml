name: Apply large desktop sources
on:
  workflow_dispatch:
  push:
    branches: [cursor/pirate-idle-fix-7c1a]
    paths:
      - .github/workflows/apply-large-sources.yml
      - tmp/large-sources/**
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/pirate-idle-fix-7c1a
      - name: Apply shell-chrome idle focus patch
        shell: bash
        run: |
          set -euo pipefail
          patch -p1 < tmp/large-sources/shell-chrome.patch
          python3 - <<'PY'
          from pathlib import Path
          text = Path("src/shell-chrome.js").read_text()
          assert "windowFocused" not in text
          assert "Do not require window focus" in text
          print("ok", len(text))
          PY
      - name: Commit if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shell-chrome.js
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "fix: pirate idle - restore shell-chrome.js (no focus freeze)"
            git push origin HEAD:cursor/pirate-idle-fix-7c1a
          fi
      - name: Remove temporary large-source restore artifacts
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf --ignore-unmatch \
            .github/workflows/apply-large-sources.yml \
            tmp/large-sources || true
          if git diff --staged --quiet; then
            echo "Nothing to clean"
          else
            git commit -m "chore: remove temporary large-source restore workflow"
            git push origin HEAD:cursor/pirate-idle-fix-7c1a
          fi
