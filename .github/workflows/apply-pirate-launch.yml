# one-shot: applies the Tools 1.5.18 edits onto this branch, then is deleted
name: Apply pirate launch (one-shot)
on:
  push:
    branches: [cursor/pirate-settings-launch-4aef]
    paths: [.github/workflows/apply-pirate-launch.yml]
permissions:
  contents: write
concurrency:
  group: apply-pirate-launch
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/pirate-settings-launch-4aef
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply and test
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f tmp/apply-pirate-launch.py ]; then echo "Already applied"; exit 0; fi
          python3 tmp/apply-pirate-launch.py
          node --test test/*.test.js
          git rm -q -f tmp/apply-pirate-launch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md package.json src test
          git commit -m "Tools 1.5.18: Settings -> Launch pirate game starts pirate combat immediately"
          git push origin HEAD:cursor/pirate-settings-launch-4aef
