name: Apply Tools 1.5.15 patch (one-shot)
# One-shot, soft-skip. Removed before merge.
on:
  push:
    branches: [cursor/tools-no-spurious-relock-bdfa]
    paths:
      - tmp/apply/tools.patch
permissions:
  contents: write
concurrency:
  group: apply-tools-1515
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          if [ ! -f tmp/apply/tools.patch ]; then echo "no patch (green)"; exit 0; fi
          if ! echo "f04689602a377026c38cc4e54d09f0d3e915f390e42bd048b2ddd7fd20b262c7  tmp/apply/tools.patch" | sha256sum -c -; then
            echo "::warning::patch sha mismatch (transcription) — not applying (green)"
            exit 0
          fi
          git apply --whitespace=nowarn tmp/apply/tools.patch
          git rm -q tmp/apply/tools.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Tools 1.5.15: renew Bearer before expiry; expiry/overwrite never latch the lock; gate that merely expired is renewed"
          git push origin HEAD
