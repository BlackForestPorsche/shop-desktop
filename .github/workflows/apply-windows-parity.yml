name: Apply Windows parity sources (one-shot)
on:
  workflow_dispatch:
  push:
    branches: [cursor/windows-setup-parity-9759]
    paths: [.github/workflows/apply-windows-parity.yml]
permissions:
  contents: write
concurrency:
  group: apply-windows-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/windows-setup-parity-9759
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: BlackForestPorsche/label-connect
          ref: cursor/windows-labels-print-9759
          path: _lc
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assemble sources
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f tmp/windows-parity.patch ]; then echo "Already applied"; exit 0; fi
          git fetch origin cursor/windows-widgets-git-update-ea13 cursor/windows-setup-installer-a813
          git checkout origin/cursor/windows-widgets-git-update-ea13 -- \
            assets/widget.html \
            src/widget-api.js \
            src/widget-preload.js \
            src/widget-session-path.js \
            src/widget-session.js \
            src/widget-main.js \
            build/installer.nsh
          git checkout origin/cursor/windows-setup-installer-a813 -- scripts/compile-windows-setup.ps1
          bash scripts/sync-labels-vendor.sh "$PWD/_lc"
          git checkout -- labels/package-lock.json
          git apply --ignore-whitespace tmp/windows-parity.patch
          node --test
          git rm -q -f tmp/windows-parity.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets build labels scripts src test README.md package.json
          git commit -m "Tools 1.5.16: Windows Setup parity (widget port, Labels Windows runtime, %LOCALAPPDATA% session dir)"
          git push origin HEAD:cursor/windows-setup-parity-9759
