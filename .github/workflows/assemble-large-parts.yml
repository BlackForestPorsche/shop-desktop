name: Assemble large-sources parts
on:
  push:
    branches:
      - cursor/labels-service-157-main-7d7c
    paths:
      - .github/workflows/assemble-large-parts.yml
      - tmp/large-sources/parts/**
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Assemble parts into large-sources chunks
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import hashlib, json
          meta = json.loads(Path("tmp/large-sources/parts/manifest-157.json").read_text())
          root = Path("tmp/large-sources/parts")
          for item in meta:
              parts=[]
              missing=[]
              for i in range(item["n"]):
                  p = root / f"{item['stem']}.part{i:02d}"
                  if not p.exists():
                      missing.append(p.name)
                  else:
                      parts.append(p.read_text())
              if missing:
                  print(f"incomplete {item['target']}: {missing}")
                  continue
              data="".join(parts)
              digest=hashlib.sha256(data.encode()).hexdigest()
              if digest != item["sha256"]:
                  print(f"SHA mismatch {item['target']}: {digest}")
                  continue
              Path(item["target"]).parent.mkdir(parents=True, exist_ok=True)
              Path(item["target"]).write_text(data)
              print("wrote", item["target"], len(data))
          PY
      - name: Commit assembled chunks
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/large-sources/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "ci: assemble Tools 1.5.7 large-sources chunks from parts"
            git push
          fi
