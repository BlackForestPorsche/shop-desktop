name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      # Binary icons are not in git. Pull/upscale the live shop mark so
      # electron-builder has a >=256x256 PNG before packaging.
      - name: Fetch app icon
        shell: bash
        run: node scripts/ensure-icon.js

      - name: Build Windows portable exe
        id: build
        continue-on-error: true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        shell: pwsh
        run: |
          npm run dist:win 2>&1 | Tee-Object -FilePath electron-builder.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report build failure
        if: steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('electron-builder.log', 'utf8');
            } catch (e) {
              log = String(e);
            }
            const tail = log.slice(-12000);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Windows build failed (run ${context.runNumber})`,
              body: [
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Commit: ${context.sha}`,
                '',
                '```text',
                tail || '(empty log)',
                '```',
              ].join('\n'),
            });
            core.setFailed('electron-builder failed; see issue for log tail');

      # Keep a fixed asset name so the shop Downloads page can link
      # …/releases/latest/download/Black.Forest.Tools-Portable.exe
      # without rewriting the URL on every windows-N tag.
      - name: Stage stable portable filename
        if: steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $portable = Get-ChildItem dist -Filter *.exe |
            Where-Object { $_.Name -match 'Portable' -and $_.Name -match '\d+\.\d+\.\d+' } |
            Select-Object -First 1
          if (-not $portable) {
            throw "No versioned Portable .exe found in dist/"
          }
          Copy-Item -Force $portable.FullName "dist/Black.Forest.Tools-Portable.exe"
          Write-Host "Staged stable asset from $($portable.Name)"

      - name: Upload build artifacts
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: blackforest-tools-windows
          path: |
            dist/*Portable*.exe
            dist/Black.Forest.Tools-Portable.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-${{ github.run_number }}
          name: Black Forest Tools for Windows (${{ github.run_number }})
          generate_release_notes: false
          make_latest: true
          files: |
            dist/*Portable*.exe
            dist/Black.Forest.Tools-Portable.exe
          body: |
            Windows build of **Black Forest Tools** — a desktop window for https://shop.blackforestautomotive.com

            ### Download
            - **Stable (always current):** [Black.Forest.Tools-Portable.exe](https://github.com/BlackForestPorsche/shop-desktop/releases/latest/download/Black.Forest.Tools-Portable.exe)
            - Versioned copy also attached on this release (`Black.Forest.Tools-Portable-…exe`) for in-app update checks

            Shop data stays on the live site. Publishing the site updates this window.

            Windows may warn about an unknown publisher (unsigned build). Choose More info → Run anyway.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
