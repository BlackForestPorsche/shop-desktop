<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Black Forest Tools</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #efe9dc;
        --fg: #1c1915;
        --muted: #5c564c;
        --brand: #0058b8;
        --brand-ink: #f4efe4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #161410;
          --fg: #f4efe4;
          --muted: #c4bbaa;
          --brand: #2b7de0;
          --brand-ink: #f4efe4;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      }
      main {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px 20px;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      .eyebrow {
        margin: 18px 0 0;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
      }
      h1 {
        margin: 10px 0 0;
        font-size: 28px;
        letter-spacing: 0.04em;
        font-weight: 650;
      }
      p {
        max-width: 36rem;
        margin: 12px 0 0;
        color: var(--muted);
        line-height: 1.5;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 22px;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 4px;
        background: var(--brand);
        color: var(--brand-ink);
        text-decoration: none;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .status {
        min-height: 1.5em;
        font-size: 13px;
      }
      a:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icon.png" alt="" />
      <p class="eyebrow">Black Forest Tools</p>
      <h1>The shop site didn't answer</h1>
      <p>
        The book and the rest of the shop are safe on the site. This computer
        just can't reach it right now. Check the network cable or Wi-Fi.
      </p>
      <a id="retry" href="https://shop.blackforestautomotive.com/">Try again</a>
      <p class="status" id="status" role="status"></p>
    </main>
    <script>
      // Keep trying by itself: a desk that started before the network was up
      // should land on the shop without anyone clicking. The site is checked
      // quietly first and the window only goes there once it answers.
      (function () {
        var SHOP = "https://shop.blackforestautomotive.com/";
        var WAIT_S = 20;
        var left = WAIT_S;
        var status = document.getElementById("status");
        var retry = document.getElementById("retry");
        var checking = false;
        var timer = 0;

        function countdown() {
          clearTimeout(timer);
          if (checking) return;
          if (left <= 0) {
            check(false);
            return;
          }
          status.textContent = "Trying again by itself in " + left + (left === 1 ? " second." : " seconds.");
          left -= 1;
          timer = setTimeout(countdown, 1000);
        }

        function check(byHand) {
          if (checking) return;
          checking = true;
          clearTimeout(timer);
          status.textContent = "Trying the shop site…";
          var done = false;
          function finish(reachable) {
            if (done) return;
            done = true;
            if (reachable) {
              window.location.href = SHOP;
              return;
            }
            checking = false;
            left = WAIT_S;
            if (byHand) {
              status.textContent = "Still no answer. Trying again by itself in " + left + " seconds.";
              left -= 1;
              timer = setTimeout(countdown, 1000);
            } else {
              countdown();
            }
          }
          var giveUp = setTimeout(function () { finish(false); }, 10000);
          fetch(SHOP, { mode: "no-cors", cache: "no-store" }).then(
            function () { clearTimeout(giveUp); finish(true); },
            function () { clearTimeout(giveUp); finish(false); }
          );
        }

        retry.addEventListener("click", function (event) {
          event.preventDefault();
          check(true);
        });
        window.addEventListener("online", function () { check(false); });
        countdown();
      })();
    </script>
  </body>
</html>
